<div class="week-selector">
  <button type="button" class="nav-button" data-testid="prev-week" (click)="goPrev()">&#8249;</button>
  <span class="week-label" data-testid="week-label">{{ weekLabel() }}</span>
  <button type="button" class="nav-button" data-testid="next-week" (click)="goNext()">&#8250;</button>
</div>
